# Render blueprint for UNNATI.
#
# One web service and one Postgres database. Apply this from the Render dashboard
# (New → Blueprint → pick this repository) and both are created together, wired to
# each other, with the migrations and seed run before the first release goes live.
#
# Free-tier notes, because they will bite otherwise:
#   - A free web service sleeps after 15 minutes idle and takes ~50 s to wake. The
#     first page load after a quiet period is slow; that is the plan, not a bug.
#   - A free Postgres instance expires after 30 days. Upgrade it, or re-create and
#     re-seed, before demonstrating anything that matters.

databases:
  - name: unnati-db
    databaseName: unnati
    user: unnati
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: unnati
    runtime: node
    plan: free
    region: singapore # nearest region to the pilot districts
    branch: main

    # `--include=dev` is load-bearing, not belt-and-braces. NODE_ENV is set to
    # production below, and npm reads that during the build and omits devDependencies —
    # which is where next's compiler, typescript, tailwind and tsx all live. Without the
    # flag the build fails at "next: not found" or the pre-deploy fails at "tsx: not
    # found", and neither message points at the cause.
    buildCommand: npm ci --include=dev && npm run build

    # Runs after the build, before the new version takes traffic. Migrations are
    # idempotent; so is the seed, which rewrites the demo rows rather than appending
    # to them. Drop the seed once this carries real data.
    preDeployCommand: npm run db:migrate && npm run db:seed

    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unnati-db
          property: connectionString

      # Render's managed Postgres presents its own CA. Internal connections do not
      # need to verify it; the app trusts the chain rather than failing closed.
      - key: DATABASE_SSL
        value: require

      # Generated once by Render and then held constant, so sessions survive a
      # redeploy. Changing it signs every user out.
      - key: SESSION_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      # Live mandi prices from the Government of India Agmarknet feed. Register a
      # free key at https://data.gov.in and set it in the Render dashboard. Without
      # it the app serves its shipped baseline prices and labels them as such — it
      # does not break, it just stops being live.
      - key: DATA_GOV_API_KEY
        sync: false

      # Optional. The instant-help assistant works without it, on keyword matching
      # against the same live data; a key only buys better phrasing and better
      # handling of unusual questions. It never sources a figure.
      - key: OPENROUTER_API_KEY
        sync: false

      # WhatsApp alerts. Optional: without them the app records messages and marks
      # them SKIPPED rather than failing. Register the templates from
      # "npm run wa:templates" in Meta WhatsApp Manager first, then point the webhook
      # at https://<service>.onrender.com/api/whatsapp/webhook
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

  # Pulls current mandi prices four times a day. Agmarknet markets report through the
  # morning and into the afternoon, so a single overnight run would miss most of them.
  # Times are UTC; 02:30 UTC is 08:00 IST.
  - type: cron
    name: unnati-price-ingest
    runtime: node
    plan: free
    region: singapore
    branch: main
    schedule: "30 2,6,10,14 * * *"
    # Same reason as the web service: the ingest script is TypeScript and runs on tsx.
    buildCommand: npm ci --include=dev
    startCommand: npm run db:ingest
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unnati-db
          property: connectionString
      - key: DATABASE_SSL
        value: require
      - key: DATA_GOV_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
